name: Surat Thani Ko Prap official tide context

on:
  workflow_dispatch:
  push:
    branches:
      - data/surat-thani-satellite-v1
    paths:
      - scripts/build_rtn_ko_prap_tide_catalog.py
      - scripts/build_rtn_ko_prap_2023_extrema.py
      - scripts/build_rtn_mae_klong_tide_catalog.py
      - scripts/match_scene_tides.py
      - data/catalog/surat_thani_mvp_optical_scenes.csv
      - .github/workflows/surat-thani-tide-catalog.yml

permissions:
  contents: write

jobs:
  tide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build official Ko Prap 2026 hourly MSL catalog
        run: python -u scripts/build_rtn_ko_prap_tide_catalog.py

      - name: QA official 2026 MSL catalog
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          csv_path = Path('data/tide/surat_thani/ko_prap_hourly_msl.csv')
          manifest_path = Path('data/tide/surat_thani/ko_prap_hourly_msl_manifest.json')
          rows = list(csv.DictReader(csv_path.open(encoding='utf-8')))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          assert len(rows) == 8760, len(rows)
          assert manifest['years'] == [2026], manifest['years']
          assert manifest['station_name'] == 'Ko Prap', manifest
          assert manifest['datum'] == 'MSL', manifest
          assert manifest['observed'] is False, manifest
          assert rows[0]['datetime_bangkok'].startswith('2026-01-01T00:00:00'), rows[0]
          assert rows[-1]['datetime_bangkok'].startswith('2026-12-31T23:00:00'), rows[-1]
          print({'rows': len(rows), 'years': manifest['years'], 'datum': manifest['datum']})
          PY

      - name: Match MVP scene times to official 2026 MSL
        run: |
          python -u scripts/match_scene_tides.py \
            --scene-catalog data/catalog/surat_thani_mvp_optical_scenes.csv \
            --tide-csv data/tide/surat_thani/ko_prap_hourly_msl.csv \
            --output data/catalog/surat_thani_mvp_optical_scenes_tide_msl.csv \
            --max-gap-minutes 90 \
            --station-name 'Ko Prap' \
            --datum 'MSL' \
            --source-url 'https://hydro.navy.mi.th/storage/frontend/article/23019/file/th/KP2026msl.pdf'

      - name: QA 2026 scene-to-MSL matching
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          rows = list(csv.DictReader(Path('data/catalog/surat_thani_mvp_optical_scenes_tide_msl.csv').open(encoding='utf-8')))
          s2_2026 = [r for r in rows if r.get('dataset') == 'sentinel2' and r.get('acquisition_datetime_bangkok', '').startswith('2026-')]
          assert len(s2_2026) >= 3, len(s2_2026)
          assert all(r.get('tide_status', '').startswith('predicted_') for r in s2_2026), s2_2026
          assert all(r.get('tide_datum') == 'MSL' for r in s2_2026), s2_2026
          print({
            'sentinel2_2026': len(s2_2026),
            'levels_m_msl': [r.get('tide_level') for r in s2_2026],
            'methods': [r.get('tide_match_method') for r in s2_2026],
          })
          PY

      - name: Build official Ko Prap 2023 extrema and scene phase
        run: python -u scripts/build_rtn_ko_prap_2023_extrema.py

      - name: QA 2023 official tide phase
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          extrema = list(csv.DictReader(Path('data/tide/surat_thani/ko_prap_2023_extrema_llw.csv').open(encoding='utf-8')))
          manifest = json.loads(Path('data/tide/surat_thani/ko_prap_2023_extrema_llw_manifest.json').read_text(encoding='utf-8'))
          matched = list(csv.DictReader(Path('data/catalog/surat_thani_2023_scenes_tide_phase.csv').open(encoding='utf-8')))
          s2 = [r for r in matched if r.get('dataset') == 'sentinel2' and r.get('acquisition_datetime_bangkok', '').startswith('2023-')]

          assert manifest['datum'] == 'LOWEST_LOW_WATER', manifest
          assert manifest['day_count'] == 365, manifest
          assert 650 <= len(extrema) <= 1200, len(extrema)
          assert len(s2) >= 3, len(s2)
          assert all(r.get('tide_phase_status') == 'MATCHED_OFFICIAL_EXTREMA' for r in s2), s2
          assert all(r.get('tide_stage') in {'RISING', 'FALLING'} for r in s2), s2
          print({
            'extrema': len(extrema),
            'sentinel2_2023': len(s2),
            'stage': [r.get('tide_stage') for r in s2],
            'phase': [r.get('tide_phase_0_1') for r in s2],
          })
          PY

      - name: Commit tide products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin data/surat-thani-satellite-v1
          git add \
            data/tide/surat_thani/ko_prap_hourly_msl.csv \
            data/tide/surat_thani/ko_prap_hourly_msl_manifest.json \
            data/catalog/surat_thani_mvp_optical_scenes_tide_msl.csv \
            data/tide/surat_thani/ko_prap_2023_extrema_llw.csv \
            data/tide/surat_thani/ko_prap_2023_extrema_llw_manifest.json \
            data/catalog/surat_thani_2023_scenes_tide_phase.csv
          if git diff --cached --quiet; then
            echo 'No official tide-context changes'
          else
            git commit -m 'data: add Ko Prap official tide context [skip ci]'
            git push
          fi
