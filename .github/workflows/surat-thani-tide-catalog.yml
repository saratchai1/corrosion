name: Surat Thani Ko Prap official tide context

on:
  workflow_dispatch:
  push:
    branches:
      - data/surat-thani-satellite-v1
    paths:
      - scripts/build_rtn_ko_prap_tide_catalog.py
      - scripts/build_rtn_mae_klong_tide_catalog.py
      - scripts/match_scene_tides.py
      - scripts/build_surat_thani_tide_web_metadata.py
      - data/catalog/surat_thani_mvp_optical_scenes.csv
      - data/tide/surat_thani/ko_prap_2023_selected_scene_phase.csv
      - data/tide/surat_thani/ko_prap_2023_selected_scene_phase_manifest.json
      - data/tide/surat_thani/ko_prap_selected_scene_stage_2023_2026.csv
      - data/tide/surat_thani/ko_prap_selected_scene_stage_2023_2026_manifest.json
      - .github/workflows/surat-thani-tide-catalog.yml

permissions:
  contents: write

jobs:
  tide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Build official Ko Prap 2026 hourly MSL catalog
        run: python -u scripts/build_rtn_ko_prap_tide_catalog.py

      - name: QA official 2026 MSL catalog
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('data/tide/surat_thani/ko_prap_hourly_msl.csv').open(encoding='utf-8')))
          manifest = json.loads(Path('data/tide/surat_thani/ko_prap_hourly_msl_manifest.json').read_text(encoding='utf-8'))
          assert len(rows) == 8760, len(rows)
          assert manifest['years'] == [2026], manifest['years']
          assert manifest['station_name'] == 'Ko Prap', manifest
          assert manifest['datum'] == 'MSL', manifest
          assert manifest['observed'] is False, manifest
          assert rows[0]['datetime_bangkok'].startswith('2026-01-01T00:00:00'), rows[0]
          assert rows[-1]['datetime_bangkok'].startswith('2026-12-31T23:00:00'), rows[-1]
          print({'rows': len(rows), 'years': manifest['years'], 'datum': manifest['datum']})
          PY

      - name: Match MVP scene times to official 2026 MSL
        run: |
          python -u scripts/match_scene_tides.py \
            --scene-catalog data/catalog/surat_thani_mvp_optical_scenes.csv \
            --tide-csv data/tide/surat_thani/ko_prap_hourly_msl.csv \
            --output data/catalog/surat_thani_mvp_optical_scenes_tide_msl.csv \
            --max-gap-minutes 90 \
            --station-name 'Ko Prap' \
            --datum 'MSL' \
            --source-url 'https://hydro.navy.mi.th/storage/frontend/article/23019/file/th/KP2026msl.pdf'

      - name: QA 2026 scene-to-MSL matching
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path('data/catalog/surat_thani_mvp_optical_scenes_tide_msl.csv').open(encoding='utf-8')))
          s2_2026 = [r for r in rows if r.get('dataset') == 'sentinel2' and r.get('acquisition_datetime_bangkok', '').startswith('2026-')]
          assert len(s2_2026) >= 3, len(s2_2026)
          assert all(r.get('tide_status', '').startswith('predicted_') for r in s2_2026), s2_2026
          assert all(r.get('tide_datum') == 'MSL' for r in s2_2026), s2_2026
          print({'sentinel2_2026': len(s2_2026), 'levels_m_msl': [r.get('tide_level') for r in s2_2026]})
          PY

      - name: QA 2023-2026 selected-scene stage table
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('data/tide/surat_thani/ko_prap_selected_scene_stage_2023_2026.csv').open(encoding='utf-8')))
          manifest = json.loads(Path('data/tide/surat_thani/ko_prap_selected_scene_stage_2023_2026_manifest.json').read_text(encoding='utf-8'))
          assert len(rows) == 12, len(rows)
          by_year = {y: [r for r in rows if r['year'] == str(y)] for y in range(2023, 2027)}
          assert all(len(by_year[y]) == 3 for y in by_year), {y: len(v) for y, v in by_year.items()}
          assert all(r['stage'] in {'RISING', 'FALLING'} for r in rows), rows
          assert all(r['phase_0_1'] and 0 <= float(r['phase_0_1']) <= 1 for r in by_year[2023]), by_year[2023]
          assert all(r['phase_0_1'] and 0 <= float(r['phase_0_1']) <= 1 for r in by_year[2025]), by_year[2025]
          assert all(r['phase_0_1'] and 0 <= float(r['phase_0_1']) <= 1 for r in by_year[2026]), by_year[2026]
          assert sum(bool(r['tide_m_msl']) for r in by_year[2024]) == 3, by_year[2024]
          assert 'thai_user_supplied_pattern' in manifest['public_url_templates'], manifest
          print({'rows': len(rows), 'years': {y: len(v) for y, v in by_year.items()}})
          PY

      - name: Publish tide context to Surat web data
        run: python -u scripts/build_surat_thani_tide_web_metadata.py

      - name: QA web tide context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('web/public/data/surat_thani/tide_context.json').read_text(encoding='utf-8'))
          assert d['coverage']['2023']['selected_scene_count'] == 3, d
          assert d['coverage']['2024']['msl_resolved_count'] == 3, d['coverage']['2024']
          assert d['coverage']['2025']['phase_resolved_count'] == 3, d['coverage']['2025']
          assert d['coverage']['2026']['matched_selected_sentinel2_scenes'] >= 3, d
          assert d['waterline_gate']['status'] == 'SCENE_LEVEL_TIDE_CONTEXT_2023_2026_PARTIAL_MSL', d
          index = json.loads(Path('web/public/data/surat_thani/index.json').read_text(encoding='utf-8'))
          assert index['tide_status'] == 'scene_level_tide_context_partial_msl', index
          print({'status': d['waterline_gate']['status'], '2024': d['coverage']['2024'], '2025': d['coverage']['2025']})
          PY

      - name: Commit tide products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin data/surat-thani-satellite-v1
          git add \
            data/tide/surat_thani/ko_prap_hourly_msl.csv \
            data/tide/surat_thani/ko_prap_hourly_msl_manifest.json \
            data/catalog/surat_thani_mvp_optical_scenes_tide_msl.csv \
            data/processed/surat_thani/web/tide_context.json \
            data/processed/surat_thani/web/index.json \
            data/processed/surat_thani/web/summary.json \
            web/public/data/surat_thani/tide_context.json \
            web/public/data/surat_thani/index.json \
            web/public/data/surat_thani/summary.json
          if git diff --cached --quiet; then
            echo 'No official tide-context changes'
          else
            git commit -m 'data: publish expanded Ko Prap tide context [skip ci]'
            git push
          fi
