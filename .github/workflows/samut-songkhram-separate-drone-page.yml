name: Restore history first and separate drone page

on:
  push:
    branches:
      - fix/samut-songkhram-restore-history-and-separate-drone
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/samut-songkhram-restore-history-and-separate-drone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply page separation
        run: python scripts/restore_history_and_separate_drone.py

      - name: Audit navigation
        run: python scripts/audit_samut_songkhram_web_navigation.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: npm ci && npm run build

      - name: Validate output
        run: test -f web/dist/client/data/project_drone_orthomosaic/summary.json

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix: restore history slider and separate drone evidence page'
            git push origin HEAD:fix/samut-songkhram-restore-history-and-separate-drone
          fi
