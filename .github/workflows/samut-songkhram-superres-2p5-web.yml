name: Samut Songkhram all-plot visual refinement

on:
  workflow_dispatch:
  push:
    branches:
      - feature/samut-songkhram-superres-2p5-web-v1
    paths:
      - 'scripts/build_samut_songkhram_superres_web.py'
      - '.github/workflows/samut-songkhram-superres-2p5-web.yml'

permissions:
  contents: write

jobs:
  build-plot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        plot:
          - 92-STC
          - 93-STC
          - 94-STC
          - 95-STC
          - 96-STC
          - 97-STC
          - 98-STC
          - 87-VSD
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install super-resolution dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U "geoai-py[sr]" rasterio pyproj pillow numpy requests

      - name: Build plot imagery
        run: |
          mkdir -p "generated/${{ matrix.plot }}"
          python scripts/build_samut_songkhram_superres_web.py \
            --plot-id "${{ matrix.plot }}" \
            --sampling-steps 20 \
            --out-dir "generated/${{ matrix.plot }}" \
            --work-dir "outputs/${{ matrix.plot }}"

      - name: Validate plot imagery
        env:
          PLOT: ${{ matrix.plot }}
        run: |
          slug=$(printf '%s' "$PLOT" | tr '[:upper:]' '[:lower:]')
          test -s "generated/$PLOT/${slug}-10m.webp"
          test -s "generated/$PLOT/${slug}-2p5m.webp"
          test -s "generated/$PLOT/${slug}.json"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os
          plot = os.environ['PLOT']
          slug = plot.lower()
          root = Path('generated') / plot
          for name in [f'{slug}-10m.webp', f'{slug}-2p5m.webp']:
              image = Image.open(root / name)
              assert image.size == (512, 512), (name, image.size)
              print(plot, name, image.size)
          PY

      - name: Upload plot imagery
        uses: actions/upload-artifact@v4
        with:
          name: superres-${{ matrix.plot }}
          path: generated/${{ matrix.plot }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-plot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/samut-songkhram-superres-2p5-web-v1

      - name: Download all plot outputs
        uses: actions/download-artifact@v4
        with:
          pattern: superres-*
          path: generated
          merge-multiple: true

      - name: Assemble web dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil

          order = ['91-STC','92-STC','93-STC','94-STC','95-STC','96-STC','97-STC','98-STC','87-VSD']
          target = Path('web/public/data/superres25')
          generated = Path('generated')
          target.mkdir(parents=True, exist_ok=True)

          summary_path = target / 'summary.json'
          by_label = {}
          if summary_path.exists():
              old = json.loads(summary_path.read_text(encoding='utf-8'))
              for item in old.get('locations', []):
                  by_label[item['label']] = item

          for image in generated.glob('*.webp'):
              shutil.copy2(image, target / image.name)
          for meta in generated.glob('*.json'):
              item = json.loads(meta.read_text(encoding='utf-8'))
              by_label[item['label']] = item

          missing = [label for label in order if label not in by_label]
          if missing:
              raise SystemExit(f'Missing plot outputs: {missing}')

          summary = {
              'scene_id': 'S2A_47PPQ_20250115_0_L2A',
              'date': '2025-01-15',
              'locations': [by_label[label] for label in order],
          }
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('assembled', len(summary['locations']), 'plots')
          PY

      - name: Validate complete set
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image

          root = Path('web/public/data/superres25')
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert len(summary['locations']) == 9, len(summary['locations'])
          for item in summary['locations']:
              for suffix in ('10m', '2p5m'):
                  image_path = root / f"{item['id']}-{suffix}.webp"
                  image = Image.open(image_path)
                  assert image.size == (512, 512), (image_path, image.size)
          print([item['label'] for item in summary['locations']])
          PY

      - name: Commit complete imagery set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data/superres25
          if git diff --cached --quiet; then
            echo 'No generated asset changes'
            exit 0
          fi
          git commit -m 'data: add all Samut Songkhram visual comparison plots'
          git push origin HEAD:feature/samut-songkhram-superres-2p5-web-v1
