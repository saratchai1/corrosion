name: Build production web artifact

on:
  workflow_dispatch:
  push:
    branches:
      - feature/coastal-change-webapp
    paths:
      - '.github/workflows/build-production-web-artifact.yml'
      - 'web/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/coastal-change-webapp

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build production bundle
        working-directory: web
        run: npm run build

      - name: Inspect client bundle
        run: |
          test -f web/dist/client/index.html
          test -f web/dist/client/data/project_tide_aware/summary.json
          test -f web/dist/client/data/project_tide_aware/imagery/2023_selected.webp
          test -f web/dist/client/data/project_tide_aware/imagery/2026_selected.webp
          du -sh web/dist/client
          find web/dist/client -type f | wc -l

      - name: Publish immutable production bundle branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/samut-songkhram-site
          mkdir -p /tmp/samut-songkhram-site
          cp -a web/dist/client/. /tmp/samut-songkhram-site/
          touch /tmp/samut-songkhram-site/.nojekyll
          cd /tmp/samut-songkhram-site
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b production-samut-songkhram
          git add -A
          git commit -m "deploy: Samut Songkhram production bundle ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin production-samut-songkhram

      - name: Upload production client bundle
        uses: actions/upload-artifact@v4
        with:
          name: samut-songkhram-production-web
          path: web/dist/client/**
          if-no-files-found: error
          retention-days: 3
