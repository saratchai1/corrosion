name: Surat Thani land accretion crop QA

on:
  push:
    branches:
      - main
      - analysis/surat-thani-land-accretion-audit
    paths:
      - 'scripts/refine_surat_thani_land_accretion_crops.py'
      - '.github/workflows/surat-thani-land-accretion-crops.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surat-thani-land-accretion-crops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Refine true-location candidate crops
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refine_surat_thani_land_accretion_crops.py
          python -m json.tool web-surat-thani/public/data/surat_thani/drone/land_accretion_candidate_audit.json >/dev/null
          grep -q 'OUTSIDE_VERIFIED_RAW_DRONE_FOOTPRINT' web-surat-thani/public/data/surat_thani/drone/land_accretion_candidate_audit.json
          test -s web-surat-thani/public/data/surat_thani/drone/t028_sentinel2_2023_crop.webp
          test -s web-surat-thani/public/data/surat_thani/drone/t028_sentinel2_2026_crop.webp
          test -s web-surat-thani/public/data/surat_thani/drone/t028_drone_crop.webp
          test -s web-surat-thani/public/data/surat_thani/drone/t038_sentinel2_2023_crop.webp
          test -s web-surat-thani/public/data/surat_thani/drone/t038_sentinel2_2026_crop.webp
          test ! -e web-surat-thani/public/data/surat_thani/drone/t038_drone_crop.webp
      - name: Commit refined audit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web-surat-thani/public/data/surat_thani/drone
          if git diff --cached --quiet; then
            echo 'No refined candidate crop changes.'
            exit 0
          fi
          git commit -m 'data: refine 37-STC accretion candidate crops'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
