name: Rayong web build, browser test, and publish

on:
  push:
    branches:
      - data/rayong-satellite-v1
    paths-ignore:
      - 'web/published/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Build production website
        run: npm run build --prefix web
      - name: Validate packaged comparison data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('web/dist/data')
          for name in (
              'rayong_planting_plots_validated.geojson',
              'apparent_change_by_transect.json',
          ):
              path = root / name
              payload = json.loads(path.read_text(encoding='utf-8'))
              count = len(payload.get('features', [])) if isinstance(payload, dict) else len(payload)
              print(f'{name}: {count} records')
          PY
      - name: Install browser test dependency
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve build and test comparison controls
        env:
          RAYONG_WEB_URL: http://127.0.0.1:4173
          RAYONG_E2E_OUT: artifacts/rayong-compare-e2e
        run: |
          python3 -m http.server 4173 --directory web/dist > /tmp/rayong-web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/data/rayong_planting_plots_validated.geojson >/dev/null
          curl -fsS http://127.0.0.1:4173/data/apparent_change_by_transect.json >/dev/null
          node scripts/test_rayong_compare.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rayong-before-after-e2e
          path: artifacts/rayong-compare-e2e/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish tested static bundle to branch
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          rm -rf web/published
          mkdir -p web/published
          cp web/dist/index.html web/published/index.html
          cp -R web/dist/assets web/published/assets
          touch web/published/.nojekyll
          printf '{"source_commit":"%s"}\n' "$GITHUB_SHA" > web/published/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/published
          if git diff --cached --quiet; then
            echo "Published bundle is unchanged"
            exit 0
          fi
          git commit -m "deploy: publish Rayong before-after [skip ci]"
          git push origin HEAD:data/rayong-satellite-v1
