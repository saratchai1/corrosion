name: Surat Thani multi-year Drone compare

on:
  push:
    branches:
      - web/surat-thani-multiyear-drone-compare
      - main
    paths:
      - 'scripts/publish_surat_thani_multiyear_compare.py'
      - 'web-surat-thani/src/DroneMultiYearPage.tsx'
      - 'web-surat-thani/src/drone-multiyear.css'
      - 'web-surat-thani/src/App.tsx'
      - '.github/workflows/surat-thani-multiyear-compare.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surat-thani-multiyear-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'

      - name: Generate all historical same-extent assets
        run: |
          set -euo pipefail
          python scripts/publish_surat_thani_multiyear_compare.py
          python -m json.tool web-surat-thani/public/data/surat_thani/drone/compare_catalog.json >/dev/null
          grep -q 'satellite-1985' web-surat-thani/public/data/surat_thani/drone/compare_catalog.json
          grep -q 'satellite-2023' web-surat-thani/public/data/surat_thani/drone/compare_catalog.json
          grep -q 'satellite-2026' web-surat-thani/public/data/surat_thani/drone/compare_catalog.json
          test -s web-surat-thani/public/data/surat_thani/drone/multiyear/satellite_1985_same_extent.webp
          test -s web-surat-thani/public/data/surat_thani/drone/multiyear/satellite_2023_same_extent.webp
          test -s web-surat-thani/public/data/surat_thani/drone/multiyear/satellite_2026_same_extent.webp

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build standalone Surat web
        working-directory: web-surat-thani
        run: |
          npm install
          npm run build

      - name: Guard against raw TIFF publication
        run: |
          set -euo pipefail
          ! find web-surat-thani -type f | grep -Ei '\.(tif|tiff)$'

      - name: Commit generated web-safe assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-surat-thani/public/data/surat_thani/drone/compare_catalog.json
          git add web-surat-thani/public/data/surat_thani/drone/multiyear
          if git diff --cached --quiet; then
            echo 'No generated asset changes.'
            exit 0
          fi
          git commit -m 'data: publish 37-STC multi-year same-extent imagery'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
