name: Krabi published shoreline data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/krabi-published-shorelines.yml'
      - 'scripts/discover_thaicoast_osf.py'
      - 'scripts/import_thaicoast_krabi.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: krabi-published-shorelines
  cancel-in-progress: false

jobs:
  inventory-osf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Inventory ThaiCoast OSF project and components
        run: |
          python scripts/discover_thaicoast_osf.py \
            --out regions/krabi/data/published/thaicoast_osf_inventory.json \
            --summary regions/krabi/data/published/thaicoast_osf_inventory.md
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('regions/krabi/data/published/thaicoast_osf_inventory.json').read_text())
          assert p['node_count'] >= 1
          assert p['file_count'] >= 1
          print(json.dumps({
              'nodes': p['node_count'],
              'files': p['file_count'],
              'candidates': p['candidate_count'],
              'errors': p['errors'],
              'candidate_paths': [x['materialized_path'] for x in p['candidates'][:30]],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: thaicoast-osf-inventory
          path: regions/krabi/data/published/thaicoast_osf_inventory.*
          if-no-files-found: error
          retention-days: 90

      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regions/krabi/data/published/thaicoast_osf_inventory.json \
                  regions/krabi/data/published/thaicoast_osf_inventory.md
          if git diff --cached --quiet; then
            echo 'No inventory changes to commit.'
            exit 0
          fi
          git commit -m 'data: inventory published ThaiCoast OSF files'
          git pull --rebase origin main
          git push origin HEAD:main
