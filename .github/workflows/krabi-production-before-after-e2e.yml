name: Krabi production through 2026 E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/krabi-production-before-after-e2e.yml'
      - 'scripts/test_krabi_province_web.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krabi-production-2026-e2e
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test public Krabi production
        env:
          KRABI_WEB_URL: https://krabi-coastal-mangrove-pilot.vercel.app
          KRABI_E2E_OUT: artifacts/krabi-production-2026
        run: node scripts/test_krabi_province_web.mjs

      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krabi-production-through-2026
          path: artifacts/krabi-production-2026/**
          if-no-files-found: error
          retention-days: 30
