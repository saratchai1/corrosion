name: Build official Mae Klong tide catalog

on:
  push:
    branches:
      - feature/samut-songkhram-rtn-tide-catalog-v1
    paths:
      - '.github/workflows/samut-songkhram-rtn-tide-catalog.yml'
      - 'requirements.txt'
      - 'scripts/build_rtn_mae_klong_tide_catalog.py'
      - 'scripts/discover_rtn_tide_archives.py'
      - 'scripts/recover_commoncrawl_tide_pdfs.py'
      - 'scripts/match_scene_tides.py'
      - 'scripts/audit_samut_songkhram_erosion_readiness.py'
      - 'tests/test_build_rtn_mae_klong_tide_catalog.py'
      - 'tests/test_match_scene_tides.py'
      - 'tests/test_audit_samut_songkhram_erosion_readiness.py'
      - 'config/samut_songkhram_erosion_free_data_v1.json'
      - 'data/catalog/project_samut_songkhram_sentinel2_scenes.csv'
      - 'data/processed/project_impact/summary.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: samut-songkhram-rtn-tide-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tide parser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'requests>=2.32,<3' \
            'pdfplumber>=0.11,<1' \
            'warcio>=1.7,<2'

      - name: Run tide and evidence unit tests
        run: |
          python -m unittest tests.test_build_rtn_mae_klong_tide_catalog -v
          python -m unittest tests.test_match_scene_tides -v
          python -m unittest tests.test_audit_samut_songkhram_erosion_readiness -v

      - name: Recover removed 2023-2025 official PDFs from Common Crawl
        run: |
          python scripts/recover_commoncrawl_tide_pdfs.py \
            --years 2023 2024 2025 \
            --crawl-limit 12 \
            --timeout-seconds 18

      - name: Search Internet Archive as a second recovery source
        run: |
          python scripts/discover_rtn_tide_archives.py \
            --years 2023 2024 2025 \
            --timeout-seconds 10

      - name: Select officially available years
        id: years
        shell: bash
        run: |
          # The 2026 PDF remains available at the current official site. Earlier
          # years are included only when an archived copy was recovered and
          # validated as a PDF. Missing years remain explicit.
          years="2026"
          for year in 2023 2024 2025; do
            pdf=".cache/rtn_tides/samut_songkhram/pak_nam_mae_klong_${year}_msl.pdf"
            source=".cache/rtn_tides/samut_songkhram/pak_nam_mae_klong_${year}_source.json"
            if [[ -f "$pdf" && -f "$source" ]]; then
              years="$year $years"
            fi
          done
          echo "years=$years" >> "$GITHUB_OUTPUT"
          echo "Official years selected: $years"

      - name: Build available official hourly MSL tide catalog
        run: |
          # Do not use --refresh: archived PDFs recovered above are intentionally
          # cached, while 2026 is downloaded from the current official URL.
          python scripts/build_rtn_mae_klong_tide_catalog.py \
            --years ${{ steps.years.outputs.years }}

      - name: Match project scenes to predicted tide
        run: |
          python scripts/match_scene_tides.py \
            --scene-catalog data/catalog/project_samut_songkhram_sentinel2_scenes.csv \
            --tide-csv data/tide/samut_songkhram/pak_nam_mae_klong_hourly_msl.csv \
            --output data/catalog/project_samut_songkhram_sentinel2_scenes_tide_matched.csv

      - name: Rebuild evidence-readiness audit
        run: python scripts/audit_samut_songkhram_erosion_readiness.py

      - name: Validate generated evidence
        run: |
          python - <<'PY'
          import calendar
          import csv
          import json
          from pathlib import Path

          tide_path = Path('data/tide/samut_songkhram/pak_nam_mae_klong_hourly_msl.csv')
          manifest_path = Path('data/tide/samut_songkhram/pak_nam_mae_klong_hourly_msl_manifest.json')
          commoncrawl_path = Path('data/tide/samut_songkhram/pak_nam_mae_klong_commoncrawl_recovery.json')
          wayback_path = Path('data/tide/samut_songkhram/pak_nam_mae_klong_archive_discovery.json')
          matched_path = Path('data/catalog/project_samut_songkhram_sentinel2_scenes_tide_matched.csv')
          readiness_path = Path('data/processed/project_impact/erosion_readiness.json')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          commoncrawl = json.loads(commoncrawl_path.read_text(encoding='utf-8'))
          wayback = json.loads(wayback_path.read_text(encoding='utf-8'))
          available_years = set(manifest['years'])
          assert 2026 in available_years, available_years
          assert available_years.issubset({2023, 2024, 2025, 2026})
          expected_rows = sum(
              8784 if calendar.isleap(year) else 8760 for year in available_years
          )

          with tide_path.open(newline='', encoding='utf-8') as handle:
              tides = list(csv.DictReader(handle))
          assert len(tides) == expected_rows, (len(tides), expected_rows)
          assert {int(row['source_year']) for row in tides} == available_years
          assert {row['datum'] for row in tides} == {'MSL'}
          assert all(row['source_url'].startswith(('http://', 'https://')) for row in tides)
          assert all(row['qa_status'] == 'official_pdf_parsed_word_coordinates' for row in tides)
          assert manifest['row_count'] == expected_rows
          assert manifest['observed'] is False
          assert len(manifest['sources']) == len(available_years)
          for source in manifest['sources']:
              expected = 8784 if calendar.isleap(source['year']) else 8760
              assert source['hour_count'] == expected
              assert len(source['sha256']) == 64
              assert source['source_url'].startswith(('http://', 'https://'))

          commoncrawl_results = {item['year']: item for item in commoncrawl['results']}
          wayback_results = {item['year']: item for item in wayback['results']}
          assert set(commoncrawl_results) == {2023, 2024, 2025}
          assert set(wayback_results) == {2023, 2024, 2025}
          for year in (2023, 2024, 2025):
              cc_status = commoncrawl_results[year]['status']
              wb_status = wayback_results[year]['status']
              assert cc_status in {
                  'RECOVERED_FROM_COMMON_CRAWL',
                  'COMMON_CRAWL_COPY_NOT_FOUND',
              }
              assert wb_status in {
                  'RECOVERED_FROM_INTERNET_ARCHIVE',
                  'ARCHIVE_NOT_FOUND',
              }
              if year in available_years:
                  assert (
                      cc_status == 'RECOVERED_FROM_COMMON_CRAWL'
                      or wb_status == 'RECOVERED_FROM_INTERNET_ARCHIVE'
                  )

          with matched_path.open(newline='', encoding='utf-8') as handle:
              scenes = list(csv.DictReader(handle))
          assert len(scenes) == 12, len(scenes)
          matched = [row for row in scenes if row['tide_status'].startswith('predicted_')]
          unmatched = [row for row in scenes if not row['tide_status'].startswith('predicted_')]
          expected_matched = 3 * len(available_years)
          assert len(matched) == expected_matched, (len(matched), expected_matched)
          assert {int(row['acquisition_datetime_utc'][:4]) for row in matched} == available_years
          assert {
              int(row['acquisition_datetime_utc'][:4]) for row in unmatched
          } == {2023, 2024, 2025, 2026}.difference(available_years)
          assert all(row['tide_level'] != '' for row in matched)
          assert all(row['tide_datum'] == 'MSL' for row in matched)
          assert all(row['tide_source_url'].startswith(('http://', 'https://')) for row in matched)

          readiness = json.loads(readiness_path.read_text(encoding='utf-8'))
          fraction = expected_matched / 12
          expected_level = (
              'TIDE_AWARE_SCREENING' if fraction >= 0.8 else 'SATELLITE_SCREENING'
          )
          assert readiness['evidence_level'] == expected_level, readiness
          assert readiness['satellite']['scene_count'] == 12
          assert readiness['satellite']['tide_matched_scene_count'] == expected_matched
          assert readiness['satellite']['tide_matched_scene_fraction'] == round(fraction, 5)
          assert readiness['erosion_effect_demonstrated'] is False

          print(json.dumps({
              'available_years': sorted(available_years),
              'tide_rows': len(tides),
              'matched_scenes': len(matched),
              'unmatched_scenes': len(unmatched),
              'commoncrawl_status': {
                  year: commoncrawl_results[year]['status']
                  for year in (2023, 2024, 2025)
              },
              'wayback_status': {
                  year: wayback_results[year]['status']
                  for year in (2023, 2024, 2025)
              },
              'evidence_level': readiness['evidence_level'],
              'source_urls': [source['source_url'] for source in manifest['sources']],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit generated tide evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/tide/samut_songkhram/pak_nam_mae_klong_hourly_msl.csv \
            data/tide/samut_songkhram/pak_nam_mae_klong_hourly_msl_manifest.json \
            data/tide/samut_songkhram/pak_nam_mae_klong_commoncrawl_recovery.json \
            data/tide/samut_songkhram/pak_nam_mae_klong_archive_discovery.json \
            data/catalog/project_samut_songkhram_sentinel2_scenes_tide_matched.csv \
            data/processed/project_impact/erosion_readiness.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'data: add official Mae Klong tide-matched scene catalog'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload tide evidence and parser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samut-songkhram-mae-klong-tide-catalog
          path: |
            data/tide/samut_songkhram/pak_nam_mae_klong_hourly_msl.csv
            data/tide/samut_songkhram/pak_nam_mae_klong_hourly_msl_manifest.json
            data/tide/samut_songkhram/pak_nam_mae_klong_commoncrawl_recovery.json
            data/tide/samut_songkhram/pak_nam_mae_klong_archive_discovery.json
            data/catalog/project_samut_songkhram_sentinel2_scenes_tide_matched.csv
            data/processed/project_impact/erosion_readiness.json
            .cache/rtn_tides/samut_songkhram/**
          if-no-files-found: warn
          retention-days: 30
